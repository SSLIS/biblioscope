<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Sources Augmenter</title>
<style>

  :root {
    --bg: #0c0f14;
    --bg-card: #13171f;
    --bg-card-hover: #181d27;
    --bg-inset: #0a0d11;
    --border: #1e2433;
    --border-active: #3b82f6;
    --text: #e2e8f0;
    --text-dim: #7a8599;
    --text-muted: #4a5568;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.15);
    --accent-bright: #60a5fa;
    --success: #34d399;
    --success-glow: rgba(52, 211, 153, 0.15);
    --warn: #fbbf24;
    --warn-glow: rgba(251, 191, 36, 0.12);
    --error: #f87171;
    --error-glow: rgba(248, 113, 113, 0.12);
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeInDown 0.6s ease;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-glow);
    border: 1px solid rgba(59, 130, 246, 0.2);
    color: var(--accent-bright);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header p {
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto;
  }

  /* Cards */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeIn 0.5s ease;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .num {
    background: var(--accent);
    color: #fff;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
  }

  /* Drop zone */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }
  .dropzone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, var(--accent-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.04);
  }
  .dropzone:hover::before, .dropzone.dragover::before {
    opacity: 1;
  }
  .dropzone-icon {
    font-size: 36px;
    margin-bottom: 10px;
    position: relative;
  }
  .dropzone-text {
    color: var(--text-dim);
    font-size: 14px;
    position: relative;
  }
  .dropzone-text strong {
    color: var(--accent-bright);
    font-weight: 500;
  }
  .dropzone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* File loaded state */
  .file-loaded {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    background: var(--bg-inset);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .file-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent-glow);
    border: 1px solid rgba(59, 130, 246, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-meta {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .file-remove {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-size: 14px;
  }
  .file-remove:hover {
    border-color: var(--error);
    color: var(--error);
    background: var(--error-glow);
  }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
  }
  .stat {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
  }
  .stat-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 4px;
  }

  /* Settings */
  .settings-row {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
  }
  .settings-row:last-child { margin-bottom: 0; }
  .field { flex: 1; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    transition: border-color 0.2s;
    outline: none;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .field input::placeholder { color: var(--text-muted); }
  .field .hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Checkbox */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    cursor: pointer;
  }
  .checkbox-row input[type="checkbox"] {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 5px;
    background: var(--bg-inset);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .checkbox-row input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .checkbox-row input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .checkbox-label {
    font-size: 13px;
    color: var(--text-dim);
  }

  /* Button */
  .btn-primary {
    width: 100%;
    padding: 14px 24px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary:hover:not(:disabled) {
    background: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
  }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-secondary {
    padding: 10px 20px;
    background: var(--success);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
  }
  .btn-secondary:hover {
    background: #2dd4bf;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px var(--success-glow);
  }

  /* Progress area */
  .progress-section {
    animation: fadeIn 0.4s ease;
  }
  .progress-bar-track {
    width: 100%;
    height: 6px;
    background: var(--bg-inset);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    border-radius: 3px;
    transition: width 0.4s ease;
    position: relative;
  }
  .progress-bar-fill.complete {
    background: linear-gradient(90deg, var(--success), #2dd4bf);
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    animation: shimmer 1.5s infinite;
  }
  .progress-bar-fill.complete::after { display: none; }

  .progress-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .progress-label { color: var(--text-dim); }
  .progress-pct {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--accent-bright);
    font-weight: 500;
  }
  .progress-pct.complete { color: var(--success); }

  .progress-detail {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* Log */
  .log {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-top: 16px;
    max-height: 200px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
  }
  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-track { background: transparent; }
  .log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .log-entry { color: var(--text-dim); }
  .log-entry .time { color: var(--text-muted); margin-right: 8px; }
  .log-entry.success { color: var(--success); }
  .log-entry.error { color: var(--error); }
  .log-entry.warn { color: var(--warn); }

  /* Results */
  .results-section {
    animation: fadeIn 0.5s ease;
  }
  .result-summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .result-card {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  .result-card.highlight {
    border-color: rgba(52, 211, 153, 0.3);
    background: linear-gradient(135deg, rgba(52, 211, 153, 0.06), transparent);
  }
  .result-card .val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 26px;
    font-weight: 500;
  }
  .result-card.highlight .val { color: var(--success); }
  .result-card .lbl {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .download-area {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  /* Error banner */
  .error-banner {
    background: var(--error-glow);
    border: 1px solid rgba(248, 113, 113, 0.3);
    border-radius: var(--radius);
    padding: 14px 18px;
    color: var(--error);
    font-size: 13px;
    margin-top: 16px;
    animation: fadeIn 0.3s ease;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Tooltip-like explanation */
  .info-box {
    background: rgba(59, 130, 246, 0.06);
    border: 1px solid rgba(59, 130, 246, 0.12);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.65;
    margin-top: 16px;
  }
  .info-box code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(59, 130, 246, 0.1);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--accent-bright);
  }

  /* Responsive */
  @media (max-width: 600px) {
    .app { padding: 24px 16px 60px; }
    .header h1 { font-size: 1.8rem; }
    .stats { grid-template-columns: 1fr; }
    .settings-row { flex-direction: column; }
    .result-summary { grid-template-columns: 1fr; }
  }

  /* 2.1 additions */
  .dropzone input[type="file"] { z-index: 2; }
  .dropzone-icon, .dropzone-text { pointer-events: none; }
  .dropzone.compact { padding: 18px 24px; }
  .dropzone.compact .dropzone-icon { font-size: 22px; margin-bottom: 4px; }
  .file-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .task {
    display: flex; gap: 12px; align-items: flex-start;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-top: 10px; cursor: pointer; background: var(--bg-inset);
    transition: border-color 0.2s;
  }
  .task:hover { border-color: rgba(59, 130, 246, 0.45); }
  .task.selected { border-color: var(--accent); background: rgba(59, 130, 246, 0.06); }
  .task.disabled { opacity: 0.45; cursor: not-allowed; }
  .task input[type="radio"] { margin-top: 4px; accent-color: var(--accent); }
  .task-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .task-desc { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.55; }
  .sub-options { margin: 4px 0 0 30px; }
  .sub-options .checkbox-row { margin-top: 10px; align-items: flex-start; }
  .sub-options .checkbox-row input[type="checkbox"] { margin-top: 2px; }
  .checkbox-label b { color: var(--text); font-weight: 600; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin: 18px 0 2px; }
  .download-area { flex-wrap: wrap; }
  .download-name { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════
// Open Sources Augmenter 2.1 (successor of the OpenAlex Reference Augmenter)
// Standalone vanilla JS. Everything runs in the browser; only identifiers (OpenAlex IDs, DOIs,
// PubMed IDs) are sent to OpenAlex, NIH iCite and the OpenAIRE Graph.
//
// Two tasks:
//  A. OpenAlex records (OpenAlex JSON, or the CSV from the OpenAlex web interface):
//     fetch the full records (CSV), resolve the cited references so that BiblioScope can do
//     co-citation and bibliographic coupling (as the original Reference Augmenter), and optionally
//     add RCR (iCite) and BIP!/usage counts (OpenAIRE). Output: an OpenAlex JSON file.
//  B. Web of Science, Scopus or BiblioScope records: add open indicators by DOI/PubMed ID.
//     Output: an "enrich" JSON file, loaded in BiblioScope together with the original files.
// ═══════════════════════════════════════════════════════════
const VERSION = '2.1';
const BATCH_SIZE = 50;          // identifiers per OpenAlex request
const PER_PAGE = 200;
const RATE_DELAY_MS = 120;
const ICITE_BATCH = 200;
const OPENAIRE_BATCH = 5;       // the OpenAIRE Graph allows at most 4 OR operators per query
const SLOW_DELAY_MS = 300;
const REF_SELECT = 'id,doi,display_name,publication_year,authorships,cited_by_count,type,primary_location,referenced_works';
const IND_SELECT = 'id,doi,ids,title,display_name,publication_year,type,cited_by_count,fwci,citation_normalized_percentile,cited_by_percentile_year,open_access,sustainable_development_goals,authorships,funders,awards,primary_topic,topics,keywords,primary_location';
const FULL_SELECT = 'id,doi,ids,title,display_name,publication_year,publication_date,type,language,authorships,primary_location,open_access,cited_by_count,fwci,citation_normalized_percentile,cited_by_percentile_year,sustainable_development_goals,funders,awards,primary_topic,topics,keywords,biblio,referenced_works,abstract_inverted_index,apc_paid,is_retracted';

const KIND_LABEL = { wos: 'Web of Science', scopus: 'Scopus', openalex: 'OpenAlex JSON', 'openalex-csv': 'OpenAlex CSV', biblioscope: 'BiblioScope collection' };
const isOpenAlexKind = k => k === 'openalex' || k === 'openalex-csv';

let state = {
  files: [],                  // [{name,size,kind,records,raw}]
  task: 'references',         // 'references' (OpenAlex records) | 'indicators'
  apiKey: '', email: '',
  refs: true, refOfRef: false, addIndicators: true,     // options for OpenAlex records
  useOpenAlex: true, useICite: true, useOpenAIRE: true,  // sources for open indicators
  running: false, progress: null, logs: [], result: null, error: null,
};
function setState(p) { Object.assign(state, p); render(); }
const ts = () => new Date().toLocaleTimeString('en-GB', { hour12: false });
// Repeated identical errors are shown once, with a count
function addLog(msg, type = '') {
  const last = state.logs[state.logs.length - 1];
  if (last && last.msg === msg && last.type === type) { last.n = (last.n || 1) + 1; last.time = ts(); }
  else state.logs = [...state.logs, { time: ts(), msg, type }];
  render();
}
const formatBytes = b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(1) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function normDoi(d) {
  const s = String(d || '').trim().toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//, '').replace(/^doi:\s*/, '');
  const m = s.match(/10\.\d{4,9}\/\S+/); return m ? m[0].replace(/[.,;]+$/, '') : '';
}
const normPmid = p => { const m = String(p || '').match(/(\d{4,9})\s*$/); return m ? m[1] : ''; };
const normWid = w => { const m = String(w || '').match(/(W\d+)\s*$/i); return m ? m[1].toUpperCase() : ''; };
const oaUrlId = wid => 'https://openalex.org/' + wid;

// ── Parsers (only what is needed) ──
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(field); field = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else field += ch;
  }
  row.push(field); if (row.some(x => x !== '')) rows.push(row);
  const head = (rows.shift() || []).map(h => h.trim());
  return { head, rows: rows.map(r => Object.fromEntries(head.map((h, i) => [h, r[i] ?? '']))) };
}
function parseWos(text) {
  const recs = []; let cur = {}, tag = null;
  for (const line of text.split(/\r?\n/)) {
    if (line.startsWith('ER')) { if (Object.keys(cur).length) recs.push(cur); cur = {}; tag = null; continue; }
    const m = line.match(/^([A-Z][A-Z0-9]) (.*)$/);
    if (m) { tag = m[1]; cur[tag] = cur[tag] ? cur[tag] + '\n' + m[2] : m[2]; }
    else if (line.startsWith('   ') && tag) cur[tag] += '\n' + line.trim();
  }
  return recs.filter(r => r.UT || r.TI).map(r => ({
    src: 'Web of Science', id: (r.UT || '').trim(), title: (r.TI || '').replace(/\s*\n\s*/g, ' ').trim(),
    year: parseInt(r.PY) || null, doi: normDoi(r.DI), pmid: normPmid(r.PM), wid: '' }));
}
const pick = (r, ...names) => { for (const n of names) if (r[n] != null && String(r[n]).trim() !== '') return String(r[n]).trim(); return ''; };
function parseCsvRecords(text) {

    const r = await readFile(f);
    if (!r.kind) { addLog(`${f.name}: ${r.error || 'not recognised as Web of Science (plain text), Scopus (CSV), OpenAlex (JSON or CSV) or a BiblioScope collection'} – skipped`, 'error'); continue; }

function collect() {
  const recs = state.files.flatMap(f => f.records.map(r => ({ ...r, file: f.name, kind: f.kind })));
  const dois = [...new Set(recs.map(r => r.doi).filter(Boolean))];
  const wids = [...new Set(recs.filter(r => !r.doi && r.wid).map(r => r.wid))];

// ── HTTP ──
async function getJSON(url, label) {

  if (!resp.ok) { const t = await resp.text().catch(() => ''); const err = new Error(`${label} ${resp.status}: ${t.slice(0, 220)}`); err.status = resp.status; throw err; }
  return resp.json();
}

  const u = new URL('https://api.openalex.org/' + path);
  for (const [k, v] of Object.entries(params)) if (v != null && v !== '') u.searchParams.set(k, v);
  if (state.apiKey) u.searchParams.set('api_key', state.apiKey);
  if (state.email) u.searchParams.set('mailto', state.email);

}

  const run = sel => getJSON(oaUrl('works', { filter, per_page: PER_PAGE, select: sel || null }), 'OpenAlex');
  if (select && selectOk[select] !== false) {
    try { return (await run(select)).results || []; }
    catch (e) { if (e.status !== 400) throw e; selectOk[select] = false; addLog('OpenAlex did not accept the field list – retrying with full records', 'warn'); }

}

    await sleep(RATE_DELAY_MS);

}

// ── iCite and OpenAIRE (shared by both tasks) ──
async function fetchICite(pmids, unreachable) {

    const batch = pmids.slice(i, i + ICITE_BATCH);

    try {

}

// ── Task A: OpenAlex records → full records, references, indicators ──

async function runOpenAlex() {

  const noId = csvRecs.filter(r => !r.wid);

    addLog(`${noId.length} CSV rows have no Work ID: the records are built from the CSV columns, and only their cited references can be looked up. Tip: include the column "Work ID" in the OpenAlex export (or choose "Add all").`, 'warn');
  }

    addLog(`Fetching ${toFetch.length} full OpenAlex records for the CSV rows (${Math.ceil(toFetch.length / BATCH_SIZE)} requests)`);
    try {
      const got = await fetchWorksByWid(toFetch, FULL_SELECT, 'Fetching the full OpenAlex records…', failed);
      for (const [k, w] of got) works.set(k, w);
      addLog(`OpenAlex: ${got.size} of ${toFetch.length} records found${got.size < toFetch.length ? ` (${toFetch.length - got.size} missing: merged or deleted in OpenAlex)` : ''}`, got.size ? 'success' : 'error');
    } catch (e) { addLog(e.message, 'error'); unreachable.openalex = true; }

  if ([...csvCites.keys()].some(Boolean)) {
    let same = 0, n = 0;
    for (const [wid, cites] of csvCites) { const w = works.get(wid); if (!w) continue; n++; const a = new Set((w.referenced_works || []).map(normWid)); if (cites.length === a.size && cites.every(c => a.has(c))) same++; }

    addLog(`Resolving ${refs.length} cited works (${Math.ceil(refs.length / BATCH_SIZE)} requests)`);

      const got = await fetchWorksByWid(refs, REF_SELECT, 'Resolving cited references…', []);
      for (const [k, w] of got) refLookup[w.id] = w;
      refs.forEach(r => { if (!got.has(r)) unresolvedSet.add(r); });
      addLog(`References: ${got.size} of ${refs.length} cited works resolved`, 'success');
      if (state.refOfRef) {
        const second = [...new Set(Object.values(refLookup).flatMap(w => (w.referenced_works || []).map(normWid)))].filter(r => r && !own.has(r) && !refLookup[oaUrlId(r)]);
        addLog(`Resolving ${second.length} second-order references`);
        const got2 = await fetchWorksByWid(second, REF_SELECT, 'Resolving 2nd-order references…', []);
        for (const [k, w] of got2) refLookup[w.id] = w;

      input_files: state.files.map(f => ({ name: f.name, kind: KIND_LABEL[f.kind], records: f.records.length })),
      original_works_count: outWorks.length, referenced_works_resolved: Object.keys(refLookup).length, referenced_works_unresolved: unresolved.length,
      records_not_found: failed.length, sources: ['OpenAlex', ...(icite.size ? ['NIH iCite'] : []), ...(openaire.size ? ['OpenAIRE Graph'] : [])], processing_time_seconds: parseFloat(elapsed) },

  setState({ running: false, progress: { pct: 100, phase: 'Complete', detail: '' },
    result: { kind: 'openalex', out, rows, stats: { works: outWorks.length, notFound: failed.length, refs: Object.keys(refLookup).length, unresolved: unresolved.length, rcr: nRcr, openaire: nBip, elapsed, unreachable } } });
  addLog(`Done in ${elapsed} s: ${outWorks.length} records, ${Object.keys(refLookup).length} cited works resolved`, 'success');
}

// ── Task B: open indicators for Web of Science, Scopus, BiblioScope (and OpenAlex) records ──

      catch (e) { addLog(e.message, 'error'); if (e.network) unreachable.openalex = true; step('batch failed'); }

        catch (e) { addLog(e.message, 'error'); if (e.network) unreachable.openalex = true; step('batch failed'); }

    }

  if (state.useICite) {
    const pmids = [...new Set([...recs.map(r => r.pmid).filter(Boolean), ...[...byWid.values()].map(w => normPmid(w.ids?.pmid)).filter(Boolean)])];
    if (pmids.length) { sources.push('NIH iCite'); icite = await fetchICite(pmids, unreachable); } else addLog('NIH iCite: no PubMed IDs in the records – skipped', 'warn');
  }
  if (state.useOpenAIRE && dois.length) { sources.push('OpenAIRE Graph'); openaire = await fetchOpenAIRE(dois, unreachable); }

  const works = [], rows = [], seen = new Set();
  let nOA = 0, nRcr = 0, nBip = 0, nAny = 0;
  for (const r of recs) {
    const w0 = (r.doi && byDoi.get(r.doi)) || (r.wid && byWid.get(r.wid)) || (r.pmid && byPmid.get(r.pmid)) || null;
    const pmid = r.pmid || normPmid(w0?.ids?.pmid);
    const x = extraValues(pmid ? icite.get(pmid) : null, r.doi ? openaire.get(r.doi) : null);
    if (w0) nOA++; if (x.rcr != null) nRcr++; if (x.bipInfluenceClass) nBip++;
    if (w0 || Object.keys(x).length) nAny++;
    rows.push(csvRow(r, w0, x, pmid));
    const key = r.doi ? 'doi:' + r.doi : (w0 && w0.id) || (pmid ? 'pmid:' + pmid : 'rec:' + r.id);
    if (!(w0 || Object.keys(x).length) || seen.has(key)) continue;
    seen.add(key);
    const w = w0 ? { ...w0 } : { id: null, doi: r.doi ? 'https://doi.org/' + r.doi : null, title: r.title, display_name: r.title, publication_year: r.year, ids: pmid ? { pmid: 'https://pubmed.ncbi.nlm.nih.gov/' + pmid } : {}, authorships: [] };
    w._biblioscope = { ...x, matched_from: [r.src], record_id: r.id };
    works.push(w);
  }
  const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
  const out = {
    meta: { mode: 'enrich', augmented_by: 'Open Sources Augmenter', version: VERSION, augmented_at: new Date().toISOString(), sources,
      input_files: state.files.map(f => ({ name: f.name, kind: KIND_LABEL[f.kind], records: f.records.length })),
      counts: { records: recs.length, dois: dois.length, openalex_matched: nOA, rcr: nRcr, openaire_matched: nBip, enriched: nAny, without_identifier: noId },
      note: 'Load this file in BiblioScope together with the files it was made from. It adds open indicators to the matching records and adds no records of its own.' },
    works,
  };
  setState({ running: false, progress: { pct: 100, phase: 'Complete', detail: '' },
    result: { kind: 'indicators', out, rows, stats: { records: recs.length, enriched: nAny, openalex: nOA, rcr: nRcr, openaire: nBip, elapsed, unreachable } } });
  addLog(`Done in ${elapsed} s: ${nAny} of ${recs.length} records have at least one open indicator`, 'success');
}
const CSV_HEAD = ['source', 'file', 'record_id', 'title', 'year', 'doi', 'pmid', 'openalex_id', 'oa_status', 'fwci', 'citation_percentile', 'top_10_percent', 'top_1_percent', 'openalex_citations', 'sdgs', 'field', 'subfield', 'institution_types', 'funders', 'rcr', 'rcr_provisional', 'nih_percentile', 'bip_influence_class', 'bip_popularity_class', 'bip_impulse_class', 'openaire_views', 'openaire_downloads'];
function csvRow(r, w, x, pmid) {
  const p = w?.citation_normalized_percentile;
  const sdg = (w?.sustainable_development_goals || []).map(s => (String(s.id).match(/(\d+)$/) || [])[1] + ' ' + s.display_name).join('; ');
  const types = w ? [...new Set((w.authorships || []).flatMap(a => (a.institutions || []).map(i => i.type)).filter(Boolean))].join('; ') : '';
  const fun = w ? (w.funders || []).map(f => f.display_name).join('; ') : '';
  return [r.src, r.file, r.id, r.title, r.year, r.doi, pmid, w?.id || '', w?.open_access?.oa_status || '', w?.fwci ?? '', p ? (p.value * 100).toFixed(1) : '', p ? p.is_in_top_10_percent : '', p ? p.is_in_top_1_percent : '',
    w?.cited_by_count ?? '', sdg, w?.primary_topic?.field?.display_name || '', w?.primary_topic?.subfield?.display_name || '', types, fun,
    x.rcr ?? '', x.rcrProv ?? '', x.nihPctl ?? '', x.bipInfluenceClass || '', x.bipPopularityClass || '', x.bipImpulseClass || '', x.views ?? '', x.downloads ?? ''];
}

// ── Downloads ──
function baseName() { const f = state.files[0]; if (!f) return 'records'; const b = f.name.replace(/\.(json|txt|csv|ciw)$/i, ''); return state.files.length > 1 ? `${b}_+${state.files.length - 1}_more` : b; }
const outName = () => state.result.kind === 'indicators' ? `${baseName()}_open-indicators.json` : `${baseName()}_augmented.json`;
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function downloadJSON() { download(outName(), JSON.stringify(state.result.out), 'application/json'); }
function downloadCSV() {
  const q = v => { const s = v == null ? '' : String(v); return /[",;\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  download(`${baseName()}_open-indicators.csv`, '﻿' + [CSV_HEAD, ...state.result.rows].map(r => r.map(q).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

// ── Render ──
function render() {
  const app = document.getElementById('app');
  const { recs, dois, wids, noDoiPmids, noId } = collect();
  const pmids = new Set(recs.map(r => r.pmid).filter(Boolean));
  const oaOnly = allOpenAlex(state.files);
  const csvWids = new Set(state.files.filter(f => f.kind === 'openalex-csv').flatMap(f => f.records.map(r => r.wid)).filter(Boolean));
  const csvNoId = state.files.filter(f => f.kind === 'openalex-csv').flatMap(f => f.records).filter(r => !r.wid).length;
  const jsonWorks = state.files.filter(f => f.kind === 'openalex').flatMap(f => openAlexWorks(f.raw));
  const knownRefs = new Set([...jsonWorks.flatMap(w => (w.referenced_works || []).map(normWid)), ...state.files.filter(f => f.kind === 'openalex-csv').flatMap(f => f.records.flatMap(r => r.cites || []))]);
  const taskOk = t => t === 'indicators' || oaOnly;
  const task = taskOk(state.task) ? state.task : 'indicators';
  const runLabel = task === 'indicators' ? `Look up ${recs.length.toLocaleString()} records`
    : `Run: ${[csvWids.size ? `fetch ${csvWids.size} records` : '', state.refs ? 'resolve cited references' : '', state.addIndicators ? 'add RCR and OpenAIRE indicators' : ''].filter(Boolean).join(', ') || 'nothing selected'}`;
  const canRun = task === 'indicators' ? (dois.length || pmids.size || wids.length) : (csvWids.size || csvNoId || jsonWorks.length) && (csvWids.size || state.refs || state.addIndicators);
  const whyNot = !canRun && task === 'indicators' && recs.length ? 'None of the records has a DOI, PubMed ID or OpenAlex ID, so nothing can be looked up. For an OpenAlex CSV, include the column "Work ID" (or "DOI") in the export, or use the task "Resolve cited references".' : '';
  app.innerHTML = `
    <div class="header">
      <div class="header-badge">⚡ Bibliometric tool · v${VERSION}</div>
      <h1>Open Sources Augmenter</h1>
      <p>Resolves the cited references of OpenAlex records for co-citation and bibliographic coupling, and adds open indicators to Web of Science, Scopus and OpenAlex records. Runs in this browser; only identifiers are sent to OpenAlex, NIH iCite and OpenAIRE.</p>
    </div>
    <div class="card">
      <div class="card-title"><span class="num">1</span> Load files</div>
      <div class="dropzone ${state.files.length ? 'compact' : ''}" id="dropzone"><input type="file" multiple accept=".txt,.csv,.json,.ciw" id="fileInput" title="">
        <div class="dropzone-icon">📄</div><div class="dropzone-text">${state.files.length ? 'Add more files: drop here or <strong>click</strong>' : 'Drop files here or <strong>click to browse</strong><br><span style="font-size:12.5px">OpenAlex (CSV from the web interface, or JSON) · Web of Science (plain text) · Scopus (CSV) · BiblioScope collection (JSON)</span>'}</div></div>
      ${state.files.length ? `<div class="file-list">${state.files.map((f, i) => `<div class="file-loaded"><div class="file-icon">📊</div><div class="file-info"><div class="file-name">${esc(f.name)}</div>
        <div class="file-meta">${KIND_LABEL[f.kind]} · ${formatBytes(f.size)} · ${f.records.length} records${f.kind === 'openalex-csv' ? ` · ${f.records.filter(r => r.cites && r.cites.length).length} with cited references${f.records.some(r => !r.wid) ? ' · no Work ID column' : ''}` : ` · ${f.records.filter(r => r.doi).length} with DOI`}</div></div>
        <button class="file-remove" data-rm="${i}" title="Remove file">✕</button></div>`).join('')}</div>
        <div class="stats"><div class="stat"><div class="stat-value">${recs.length.toLocaleString()}</div><div class="stat-label">Records</div></div>
        <div class="stat"><div class="stat-value">${(oaOnly ? knownRefs.size : dois.length).toLocaleString()}</div><div class="stat-label">${oaOnly ? 'Cited works known' : 'Distinct DOIs'}</div></div>
        <div class="stat"><div class="stat-value">${pmids.size.toLocaleString()}</div><div class="stat-label">PubMed IDs</div></div></div>
        ${oaOnly && csvWids.size ? `<div class="info-box">The OpenAlex CSV holds only some fields. The full records (with references, DOI, institutions, funders, SDGs) are fetched from OpenAlex by their Work ID.</div>` : ''}
        ${!oaOnly && noId ? `<div class="info-box">${noId} record${noId === 1 ? ' has' : 's have'} neither DOI, OpenAlex ID nor PubMed ID and cannot be looked up.</div>` : ''}` : ''}
    </div>
    ${state.files.length ? `
    <div class="card">
      <div class="card-title"><span class="num">2</span> Task</div>
      <label class="task ${task === 'references' ? 'selected' : ''} ${oaOnly ? '' : 'disabled'}">
        <input type="radio" name="task" value="references" ${task === 'references' ? 'checked' : ''} ${oaOnly ? '' : 'disabled'}>
        <div><div class="task-title">Resolve cited references (OpenAlex records)</div>
        <div class="task-desc">For co-citation, bibliographic coupling, cited references and the historiograph in BiblioScope. ${oaOnly ? 'Gives an OpenAlex JSON file to load in BiblioScope on its own.' : 'Only for OpenAlex files. Web of Science and Scopus records carry their own cited references, which BiblioScope reads directly.'}</div></div></label>
      ${task === 'references' ? `<div class="sub-options">
        ${csvWids.size ? `<label class="checkbox-row"><input type="checkbox" checked disabled><span class="checkbox-label"><b>Fetch the full records</b> for the ${csvWids.size} CSV rows (${Math.ceil(csvWids.size / BATCH_SIZE)} requests)</span></label>` : ''}
        <label class="checkbox-row"><input type="checkbox" data-opt="refs" ${state.refs ? 'checked' : ''}><span class="checkbox-label"><b>Resolve the cited works</b> (author, year, source of each reference)${knownRefs.size ? ` – about ${knownRefs.size.toLocaleString()} works, ~${Math.ceil(knownRefs.size / BATCH_SIZE)} requests` : ''}</span></label>
        <label class="checkbox-row"><input type="checkbox" data-opt="refOfRef" ${state.refOfRef ? 'checked' : ''}><span class="checkbox-label">Also resolve references of references (2nd order) – many more requests</span></label>
        <label class="checkbox-row"><input type="checkbox" data-opt="addIndicators" ${state.addIndicators ? 'checked' : ''}><span class="checkbox-label"><b>Add RCR (NIH iCite) and BIP!/usage counts (OpenAIRE)</b>. FWCI, percentiles, open access and SDGs are part of the OpenAlex records already.</span></label>
      </div>` : ''}
      <label class="task ${task === 'indicators' ? 'selected' : ''}">
        <input type="radio" name="task" value="indicators" ${task === 'indicators' ? 'checked' : ''}>
        <div><div class="task-title">Add open indicators</div>
        <div class="task-desc">Looks up the records by DOI, OpenAlex ID or PubMed ID. Gives a file that is loaded in BiblioScope <b>together with</b> the original files; it adds values to the matching records and no records of its own.</div></div></label>
      ${task === 'indicators' ? `<div class="sub-options">
        <label class="checkbox-row"><input type="checkbox" data-opt="useOpenAlex" ${state.useOpenAlex ? 'checked' : ''}><span class="checkbox-label"><b>OpenAlex</b>: FWCI, citation percentile and top 1 %/10 %, open access status (incl. diamond), SDGs, topics, organisation types (ROR), funders · ~${Math.ceil(dois.length / BATCH_SIZE) + Math.ceil(wids.length / BATCH_SIZE) + Math.ceil(noDoiPmids.length / BATCH_SIZE)} requests</span></label>
        <label class="checkbox-row"><input type="checkbox" data-opt="useICite" ${state.useICite ? 'checked' : ''}><span class="checkbox-label"><b>NIH iCite</b>: relative citation ratio (RCR), NIH percentile. Only records with a PubMed ID; no RCR for the most recent year, provisional for the two years before.</span></label>
        <label class="checkbox-row"><input type="checkbox" data-opt="useOpenAIRE" ${state.useOpenAIRE ? 'checked' : ''}><span class="checkbox-label"><b>OpenAIRE Graph</b>: BIP! impact classes (C1 = top 0.01 % … C5 = bottom 99 %) and usage counts · ~${Math.ceil(dois.length / OPENAIRE_BATCH)} requests (at most ${OPENAIRE_BATCH} DOIs per request)</span></label>
      </div>` : ''}
      <div class="section-label">OpenAlex access</div>
      <div class="settings-row" style="margin-top:8px">
        <div class="field"><label>API key</label><input type="text" id="apiKey" value="${esc(state.apiKey)}" placeholder="optional – free at openalex.org/settings/api"><div class="hint">Needed beyond OpenAlex's free daily allowance.</div></div>
        <div class="field"><label>E-mail (polite pool)</label><input type="email" id="email" value="${esc(state.email)}" placeholder="you@university.edu"><div class="hint">Sent to OpenAlex only.</div></div>
      </div>
      <div class="info-box">Indicators come from different databases with different coverage and definitions: OpenAlex FWCI and percentiles are computed against OpenAlex and are usually higher than in SciVal or InCites; RCR is benchmarked to NIH-funded papers; BIP! classes are based on the OpenAIRE Graph. They describe citation impact and use, not quality.</div>
    </div>
    <div class="card">
      <div class="card-title"><span class="num">3</span> Run</div>
      ${!state.running ? `<button class="btn-primary" id="runBtn" ${canRun ? '' : 'disabled'}>${esc(runLabel)}</button>${whyNot ? `<div class="hint" id="whyNot" style="margin-top:8px">${esc(whyNot)}</div>` : ''}` : ''}
      ${state.progress ? renderProgress() : ''}
      ${state.logs.length ? renderLog() : ''}
      ${state.error ? `<div class="error-banner">⚠ ${esc(state.error)}</div>` : ''}
      ${state.result ? renderResults() : ''}
    </div>` : (state.logs.length ? `<div class="card">${renderLog()}</div>` : '')}
  `;
  const dz = document.getElementById('dropzone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
  document.getElementById('fileInput').addEventListener('change', e => handleFiles(e.target.files));
  app.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { const files = state.files.filter((_, i) => i !== +b.dataset.rm); setState({ files, task: defaultTask(files), result: null, progress: null, error: null }); }));
  app.querySelectorAll('input[name=task]').forEach(r => r.addEventListener('change', e => setState({ task: e.target.value, result: null, progress: null })));
  app.querySelectorAll('[data-opt]').forEach(c => c.addEventListener('change', e => setState({ [c.dataset.opt]: e.target.checked })));
  const ak = document.getElementById('apiKey'); if (ak) ak.addEventListener('input', e => { state.apiKey = e.target.value.trim(); });
  const em = document.getElementById('email'); if (em) em.addEventListener('input', e => { state.email = e.target.value.trim(); });
  const run = document.getElementById('runBtn'); if (run) run.addEventListener('click', () => {
    state.task = task;
    (task === 'indicators' ? runIndicators : runOpenAlex)().catch(e => setState({ running: false, error: e.message }));
  });
  const dj = document.getElementById('downloadBtn'); if (dj) dj.addEventListener('click', downloadJSON);
  const dc = document.getElementById('downloadCsvBtn'); if (dc) dc.addEventListener('click', downloadCSV);
  const lg = document.querySelector('.log'); if (lg) lg.scrollTop = lg.scrollHeight;
}
function renderProgress() {
  const p = state.progress; const done = p.pct >= 100 && !state.running;
  return `<div class="progress-section"><div class="progress-status"><span class="progress-label">${esc(p.phase)}</span><span class="progress-pct ${done ? 'complete' : ''}">${p.pct}%</span></div>
    <div class="progress-bar-track"><div class="progress-bar-fill ${done ? 'complete' : ''}" style="width:${p.pct}%"></div></div>${p.detail ? `<div class="progress-detail">${esc(p.detail)}</div>` : ''}</div>`;
}
function renderLog() { return `<div class="log">${state.logs.map(l => `<div class="log-entry ${l.type}"><span class="time">${l.time}</span>${esc(l.msg)}${l.n > 1 ? ` <b>(×${l.n})</b>` : ''}</div>`).join('')}</div>`; }
function renderResults() {
  const r = state.result, s = r.stats;
  const unreach = Object.keys(s.unreachable || {});
  const warn = unreach.length ? `<div class="error-banner">Not reached or not usable: ${unreach.map(k => ({ openalex: 'OpenAlex', icite: 'NIH iCite', openaire: 'OpenAIRE Graph' }[k])).join(', ')}. The other sources were used.</div>` : '';
  if (r.kind === 'openalex') return `<div class="results-section"><div class="result-summary">
      <div class="result-card highlight"><div class="val">${s.works.toLocaleString()}</div><div class="lbl">OpenAlex records${s.notFound ? ` (${s.notFound} not found)` : ''}</div></div>
      <div class="result-card"><div class="val">${s.refs.toLocaleString()}</div><div class="lbl">Cited works resolved${s.unresolved ? ` (${s.unresolved} unresolved)` : ''}</div></div>
      <div class="result-card"><div class="val">${s.rcr}</div><div class="lbl">With RCR (iCite)</div></div>
      <div class="result-card"><div class="val">${s.openaire}</div><div class="lbl">With BIP! classes (OpenAIRE)</div></div></div>
    ${warn}
    <div class="download-area"><button class="btn-secondary" id="downloadBtn">⬇ Download for BiblioScope (JSON)</button><button class="btn-secondary" id="downloadCsvBtn">⬇ Indicator table (CSV)</button><span class="download-name">${esc(outName())}</span></div>
    <div class="info-box">Load the JSON file in BiblioScope on its own (it holds the records and their resolved references); co-citation, bibliographic coupling, cited references and the historiograph then work as for Web of Science data.</div></div>`;
  const pc = (a, b) => b ? Math.round(100 * a / b) + ' %' : '–';
  return `<div class="results-section"><div class="result-summary">
      <div class="result-card highlight"><div class="val">${pc(s.enriched, s.records)}</div><div class="lbl">Records with an open indicator (${s.enriched}/${s.records})</div></div>
      <div class="result-card"><div class="val">${s.openalex}</div><div class="lbl">Matched in OpenAlex</div></div>
      <div class="result-card"><div class="val">${s.rcr}</div><div class="lbl">With RCR (iCite)</div></div>
      <div class="result-card"><div class="val">${s.openaire}</div><div class="lbl">With BIP! classes (OpenAIRE)</div></div></div>
    ${warn}
    <div class="download-area"><button class="btn-secondary" id="downloadBtn">⬇ Download for BiblioScope (JSON)</button><button class="btn-secondary" id="downloadCsvBtn">⬇ Indicator table (CSV)</button><span class="download-name">${esc(outName())}</span></div>
    <div class="info-box">Load the JSON file in BiblioScope <b>together with</b> the Web of Science and Scopus files it was made from. It adds the indicators to the matching records (by DOI or title) and adds no records of its own; see the <i>Indicators</i> tab. The CSV file has one row per input record for use elsewhere.</div></div>`;
}
render();

</script>
